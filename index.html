<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金阳 MBTI测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif}
body{background:#f6f9ff;color:#222;min-height:100vh;overflow-x:hidden}
.container{max-width:720px;margin:0 auto;padding:24px}

/* 欢迎首页 */
.welcome-box{display:block;text-align:center;padding:40px 20px}
.welcome-box h1{font-size:28px;color:#2c4b80;margin-bottom:16px}
.welcome-box p{font-size:17px;color:#444;margin-bottom:32px;line-height:1.6}
.welcome-btn-group{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.welcome-btn{padding:14px 24px;border-radius:10px;border:none;font-size:17px;cursor:pointer;transition:0.2s}
.btn-yes{background:#739bd8;color:#fff}
.btn-yes:hover{background:#5e88c7}
.btn-no{background:#dde5f2;color:#222}
.btn-no:hover{background:#c8d7ee}
.welcome-tip{margin-top:24px;font-size:14px;color:#777}

/* 答题页 */
.quiz-box{display:none}
.title{text-align:center;font-size:28px;margin-bottom:12px;color:#2c4b80}
.progress-wrap{width:100%;height:8px;background:#dde5f2;border-radius:99px;margin-bottom:28px}
.progress-bar{height:8px;background:#739bd8;border-radius:99px;transition:0.3s}
.question{font-size:20px;margin:20px 0;line-height:1.5}
.option{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid #d6e1f0;background:#ffffff;color:#222;border-radius:10px;font-size:17px;cursor:pointer;transition:0.2s}
.option:hover{background:#eef4fd;border-color:#9cb8e0}

/* 结果页 */
.result-box{display:none;padding:24px;border:1px solid #d6e1f0;border-radius:14px;margin-top:30px;background:#fff}
.action-group{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.action-btn{padding:12px 14px;border-radius:8px;border:none;font-size:16px;cursor:pointer;transition:0.2s}
.btn-flower{background:#d887a7;color:#fff}
.btn-flower:hover{background:#c27090}
.btn-msg{background:#739bd8;color:#fff}
.btn-msg:hover{background:#5e88c7}
.btn-money{background:#e6b849;color:#222}
.btn-money:hover{background:#d1a338}
.btn-share{background:#44b888;color:#fff}
.btn-share:hover{background:#34a274}
.tip-text-result{margin:16px 0;color:#666;font-size:15px}
#radarBox{width:100%;height:360px;margin:20px 0}

/* 烟花画布 */
#fireCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:99}
.flower{position:fixed;font-size:36px;pointer-events:none;animation:flyUp 2.2s ease-out forwards;z-index:100}
@keyframes flyUp{
0{opacity:1;transform:translateY(0) scale(1)}
100%{opacity:0;transform:translateY(-320px) scale(1.4)}
}

/* 悄悄话弹窗 */
.modal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.7);z-index:101;align-items:center;justify-content:center;padding:20px}
.modal-content{background:#fff;padding:24px;border-radius:12px;width:100%;max-width:480px}
.modal textarea{width:100%;min-height:120px;margin:14px 0;padding:12px;border-radius:8px;background:#f6f9ff;color:#222;border:1px solid #d6e1f0;font-size:16px;resize:vertical}
.modal-btn-group{display:flex;gap:10px;justify-content:flex-end}
.modal-btn{padding:10px 16px;border-radius:8px;border:none;cursor:pointer;font-size:15px}
.send{background:#739bd8;color:white}
.close{background:#b9c5d6;color:#222}
.modal-tip{margin-top:10px;color:#666;font-size:14px}

/* 分享卡片弹窗 */
.shareModal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.75);z-index:102;align-items:center;justify-content:center;padding:16px}
.shareCardWrap{background:#fff;padding:20px;border-radius:16px;max-width:420px;width:100%}
#shareCard{background:linear-gradient(135deg,#e8f0fe,#dcebff);padding:28px 20px;border-radius:14px;text-align:center}
#shareCard h2{color:#2c4b80;font-size:24px;margin-bottom:8px}
#shareCard .sub-title{color:#4a6792;font-size:15px;margin-bottom:16px}
#shareCard .type-text{font-size:42px;font-weight:bold;color:#2c4b80;margin:12px 0}
#shareCard .quote{margin:16px 0;color:#333;font-size:16px}
#shareCard .footer-note{margin-top:22px;color:#666;font-size:14px}
#cardRadar{width:100%;height:240px}
.shareBtnGroup{margin-top:16px;display:flex;gap:10px;justify-content:center}
.saveCardBtn,.closeShareBtn{padding:11px 18px;border-radius:8px;border:none;cursor:pointer;font-size:16px}
.saveCardBtn{background:#44b888;color:#fff}
.closeShareBtn{background:#b9c5d6}
</style>
</head>
<body>
<div class="container">
    <!-- 欢迎首页 -->
    <div class="welcome-box" id="welcome">

// 设置身份
function setIdentity(jinyang){
    isJinYang = jinyang;
    document.getElementById("welcome").style.display="none";
    document.getElementById("quiz").style.display="block";
    document.getElementById("quizTitle").innerText = isJinYang ? "金阳 MBTI 测试" : "MBTI 测试";
    render();
}
//渲染题目
function render(){
    const item=questions[current];
    document.getElementById("qText").innerText = item.q;
    const optWrap = document.getElementById("optWrap");
    optWrap.innerHTML="";
    document.getElementById("progressBar").style.width = (current/totalQ*100)+"%";
    item.o.forEach((txt,i)=>{
        const btn = document.createElement("button");
        btn.className="option";
        btn.innerText=txt;
        btn.onclick=()=>{
            const val = 4-i;
            score[item.k[0]] += val;
            score[item.k[1]] += (4-val);
            current++;
            if(current >= totalQ){
                showResult();
            }else{
                render();
            }
        }
        optWrap.appendChild(btn);
    })
}

function showResult(){
    document.getElementById("quiz").style.display="none";
    document.getElementById("result").style.display="block";
    let type="";
    type += score.E>score.I ? "E":"I";
    type += score.S>score.N ? "S":"N";
    type += score.T>score.F ? "T":"F";
    type += score.J>score.P ? "J":"P";
    document.getElementById("typeText").innerText = type;
    const quoteText = quotes[type] || "独一无二的你";
    document.getElementById("descText").innerText = quoteText;
    const tipEl = document.getElementById("resultTip");
    if(isJinYang){
        tipEl.innerText = "✨金阳，可以选择送花花、发送悄悄话，或者给开发者100万现金，还能生成分享图保存";
    }else{
        tipEl.innerText = "✨你可以选择送花花、发送悄悄话，或者给开发者100万现金，还能生成分享图保存";
    }
    drawRadar();
    startFireworks();
}

//雷达图
function drawRadar(){
    if(radarChart) radarChart.destroy();
    const ctxRadar = document.createElement('canvas');
    document.getElementById("radarBox").innerHTML="";
    document.getElementById("radarBox").appendChild(ctxRadar);
    radarChart = new Chart(ctxRadar,{
        type:"radar",
        data:{
            labels:["E外向","I内向","S实感","N直觉","T思考","F情感","J判断","P感知"],
            datasets:[{data:[score.E,score.I,score.S,score.N,score.T,score.F,score.J,score.P],backgroundColor:"rgba(115,155,216,0.2)",borderColor:"#739bd8",pointBackgroundColor:"#739bd8"}]
        },
        options:{scales:{r:{min:0,max:16}},maintainAspectRatio:false}
    })
}

//烟花
const canvas=document.getElementById("fireCanvas");
const ctx=canvas.getContext("2d");
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
resize();
window.addEventListener("resize",resize);
let fireList=[];
class Particle{
    constructor(x,y,color){
        this.x=x;this.y=y;this.sx=(Math.random()-0.5)*8;this.sy=(Math.random()-0.5)*8;this.alpha=1;this.color=color;this.size=Math.random()*3+1
    }
    update(){this.x+=this.sx;this.y+=this.sy;this.alpha-=0.018}
    draw(){ctx.save();ctx.globalAlpha=this.alpha;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}
}
function startFireworks(){
    const colors=['#ff4466','#ffdd22','#44eeff','#77ff44','#ff77ee'];
    for(let a=0;a<8;a++){
        setTimeout(()=>{
            const x = Math.random()*canvas.width;
            const y = Math.random()*canvas.height*0.4;
            for(let i=0;i<120;i++){
                fireList.push(new Particle(x,y,colors[Math.floor(Math.random()*colors.length)]))
            }
        },a*300)
    }
}
function animate(){
    requestAnimationFrame(animate);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=fireList.length-1;i>=0;i--){
        fireList[i].update();fireList[i].draw();
        if(fireList[i].alpha<=0) fireList.splice(i,1);
    }
}
animate();

const shareModal = document.getElementById("shareModal");

    shareModal.style.display="flex";
    const type = document.getElementById("typeText").innerText;
    const quoteText = quotes[type] || "独一无二的你";
    document.getElementById("cardTitle").innerText = isJinYang ? "金阳的MBTI人格报告" : "MBTI人格报告";
    document.getElementById("cardType").innerText = type;
    document.getElementById("cardQuote").innerText = quoteText;
    if(cardChart) cardChart.destroy();
    const cardRadarDom = document.getElementById("cardRadar");
    cardRadarDom.innerHTML="";
    const cardCtx = document.createElement("canvas");
    cardRadarDom.appendChild(cardCtx);
    cardChart = new Chart(cardCtx,{
        type:"radar",
        data:{
            labels:["E","I","S","N","T","F","J","P"],
            datasets:[{data:[score.E,score.I,score.S,score.N,score.T,score.F,score.J,score.P],backgroundColor:"rgba(115,155,216,0.2)",borderColor:"#739bd8",pointBackgroundColor:"#739bd8"}]
        },
        options:{scales:{r:{min:0,max:16}},maintainAspectRatio:false}
    })
}
function closeShareModal(){shareModal.style.display="none"}
document.getElementById("saveCardBtn").onclick = function(){
    const cardDom = document.getElementById("shareCard");
    html2canvas(cardDom,{useCORS:true,scale:2}).then(canvas=>{
        const link = document.createElement("a");
        link.download = isJinYang ? "金阳MBTI报告.png" : "MBTI报告.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
    })
}
