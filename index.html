<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金阳 MBTI测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif}
body{background:#f6f9ff;color:#222;min-height:100vh;overflow-x:hidden}
.container{max-width:720px;margin:0 auto;padding:24px}
.title{text-align:center;font-size:28px;margin-bottom:12px;color:#2c4b80}
.progress-wrap{width:100%;height:8px;background:#dde5f2;border-radius:99px;margin-bottom:28px}
.progress-bar{height:8px;background:#739bd8;border-radius:99px;transition:0.3s}
.question{font-size:20px;margin:20px 0;line-height:1.5}
.option{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid #d6e1f0;background:#ffffff;color:#222;border-radius:10px;font-size:17px;cursor:pointer;transition:0.2s}
.option:hover{background:#eef4fd;border-color:#9cb8e0}
.result-box{display:none;padding:24px;border:1px solid #d6e1f0;border-radius:14px;margin-top:30px;background:#fff}
.action-group{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
.action-btn{padding:12px 18px;border-radius:8px;border:none;font-size:16px;cursor:pointer;transition:0.2s}
.btn-flower{background:#d887a7;color:#fff}
.btn-flower:hover{background:#c27090}
.btn-msg{background:#739bd8;color:#fff}
.btn-msg:hover{background:#5e88c7}
.tip-text-result{margin:16px 0;color:#666;font-size:15px}

/* 烟花画布铺满全屏 */
#fireCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:99}
/* 花朵漂浮元素 */
.flower{position:fixed;font-size:36px;pointer-events:none;animation:flyUp 2.2s ease-out forwards;z-index:100}
@keyframes flyUp{
0{opacity:1;transform:translateY(0) scale(1)}
100%{opacity:0;transform:translateY(-320px) scale(1.4)}
}
/* 悄悄话弹窗 */
.modal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.7);z-index:101;align-items:center;justify-content:center;padding:20px}
.modal-content{background:#fff;padding:24px;border-radius:12px;width:100%;max-width:480px}
.modal textarea{width:100%;min-height:120px;margin:14px 0;padding:12px;border-radius:8px;background:#f6f9ff;color:#222;border:1px solid #d6e1f0;font-size:16px;resize:vertical}
.modal-buttons{display:flex;gap:10px;justify-content:flex-end}
.modal-btn{padding:10px 16px;border-radius:8px;border:none;cursor:pointer;font-size:15px}
.send{background:#739bd8;color:white}
.close{background:#b9c5d6;color:#222}
.modal-tip{margin-top:10px;color:#666;font-size:14px}
#radarBox{width:100%;height:360px;margin:20px 0}
</style>
</head>
<body>
<div class="container">
  <h1 class="title">金阳 MBTI 测试</h1>
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="question" id="qText"></div>
  <div id="optWrap"></div>
  <div class="result-box" id="result">
    <h2>你的类型：<span id="typeText"></span></h2>
    <div id="radarBox"></div>
    <p id="descText" style="margin-top:12px;line-height:1.6"></p>
    <p class="tip-text-result">✨点击【🌸送花花】送给开发者，【💬悄悄话】给开发者留言</p>
    <div class="action-group">
      <button class="action-btn btn-flower" id="sendFlowerBtn">🌸 送花花</button>
      <button class="action-btn btn-msg" id="openMsgBtn">💬 悄悄话</button>
    </div>
  </div>
</div>

<!-- 悄悄话弹窗 -->
<div class="modal" id="msgModal">
  <div class="modal-content">
    <h3>给开发者留言</h3>
    <textarea id="msgInput" placeholder="写下你的悄悄话..."></textarea>
    <p class="modal-tip">⚠ GitHub静态网页无后端，留言点击复制，手动发给开发者</p>
    <div class="modal-buttons">
      <button class="modal-btn close" id="closeModal">取消</button>
      <button class="modal-btn send" id="submitMsg">复制留言</button>
    </div>
  </div>
</div>

<canvas id="fireCanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// 48题量表，五级选项
const questions = [
  {q:"聚会后，你通常？",o:["非常符合","比较符合","一般","不太符合","完全不符合"],k:["E","I"]},
  {q:"看待一件事，你更看重细节事实",o:["非常符合","比较符合","一般","不太符合","完全不符合"],k:["S","N"]},
  {q:"做决定优先逻辑公平",o:["非常符合","比较符合","一般","不太符合","完全不符合"],k:["T","F"]},
  {q:"生活习惯喜欢提前计划",o:["非常符合","比较符合","一般","不太符合","完全不符合"],k:["J","P"]},
];
let score={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
let current=0;
const totalQ=questions.length;
const qEl=document.getElementById('qText');
const optWrap=document.getElementById('optWrap');
const resultBox=document.getElementById('result');
const typeText=document.getElementById('typeText');
const descText=document.getElementById('descText');
const progressBar=document.getElementById('progressBar');
let radarChart=null;

// 渲染题目
function render(){
  const item=questions[current];
  qEl.innerText=item.q;
  optWrap.innerHTML="";
  progressBar.style.width = (current / totalQ *100)+"%";
  item.o.forEach((txt,i)=>{
    const btn=document.createElement('button');
    btn.className="option";
    btn.innerText=txt;
    btn.onclick=()=>{
      const val = 4-i;
      score[item.k[0]] += val;
      score[item.k[1]] += (4-val);
      current++;
      if(current >= totalQ){showResult();}
      else render();
    }
    optWrap.appendChild(btn);
  })
}

// 显示结果+启动烟花
function showResult(){
  qEl.style.display="none";optWrap.style.display="none";
  resultBox.style.display="block";
  progressBar.style.width="100%";
  let type="";
  type += score.E>score.I ? "E":"I";
  type += score.S>score.N ? "S":"N";
  type += score.T>score.F ? "T":"F";
  type += score.J>score.P ? "J":"P";
  typeText.innerText=type;
  descText.innerText="这是你的MBTI类型描述，你可以在这里替换文案。";
  drawRadar();
  startFireworks(); // 答完自动放烟花
}

//雷达图
function drawRadar(){
  if(radarChart) radarChart.destroy();
  const ctxRadar = document.createElement('canvas');
  document.getElementById("radarBox").innerHTML="";
  document.getElementById("radarBox").appendChild(ctxRadar);
  radarChart = new Chart(ctxRadar,{
    type:"radar",
    data:{
      labels:["E外向","I内向","S实感","N直觉","T思考","F情感","J判断","P感知"],
      datasets:[{data:[score.E,score.I,score.S,score.N,score.T,score.F,score.J,score.P],backgroundColor:"rgba(115,155,216,0.2)",borderColor:"#739bd8",pointBackgroundColor:"#739bd8"}]
    },
    options:{scales:{r:{min:0,max:16}}}
  })
}
render();

// ========== 烟花特效代码 ==========
const canvas=document.getElementById("fireCanvas");
const ctx=canvas.getContext("2d");
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
resize();
window.addEventListener('resize',resize);
let fireList=[];
class Particle{
  constructor(x,y,color){
    this.x=x;this.y=y;this.sx=(Math.random()-0.5)*8;this.sy=(Math.random()-0.5)*8;
    this.alpha=1;this.color=color;this.size=Math.random()*3+1;
  }
  update(){
    this.x+=this.sx;this.y+=this.sy;this.alpha-=0.018;
  }
  draw(){
    ctx.save();ctx.globalAlpha=this.alpha;
    ctx.fillStyle=this.color;ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}
function startFireworks(){
  const colors=['#ff4466','#ffdd22','#44eeff','#77ff44','#ff77ee'];
  for(let a=0;a<8;a++){
    setTimeout(()=>{
      const x=Math.random()*canvas.width;
      const y=Math.random()*canvas.height*0.4;
      for(let i=0;i<120;i++){
        fireList.push(new Particle(x,y,colors[Math.floor(Math.random()*colors.length)]))
      }
    },a*300)
  }
}
function animate(){
  requestAnimationFrame(animate);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=fireList.length-1;i>=0;i--){
    fireList[i].update();fireList[i].draw();
    if(fireList[i].alpha <=0) fireList.splice(i,1);
  }
}
animate();

// ========== 送花花按钮 ==========
const flowerEmoji = ["🌸","🌷","🌺","💐","🌹","🌻"];
document.getElementById('sendFlowerBtn').onclick = function(e){
  for(let n=0;n<6;n++){
    setTimeout(()=>{
      const f=document.createElement("div");
      f.className="flower";
      f.innerText=flowerEmoji[Math.floor(Math.random()*flowerEmoji.length)];
      f.style.left = e.clientX + (n*30) +"px";
      f.style.top = e.clientY +"px";
      document.body.appendChild(f);
      setTimeout(()=>f.remove(),2200);
    },n*100)
  }
}

// ========== 悄悄话弹窗逻辑 ==========
const modal = document.getElementById('msgModal');
const openMsgBtn = document.getElementById('openMsgBtn');
const closeModal = document.getElementById('closeModal');
const submitMsg = document.getElementById('submitMsg');
const msgInput = document.getElementById('msgInput');

openMsgBtn.onclick = ()=> modal.style.display="flex";
closeModal.onclick = ()=> modal.style.display="none";
modal.onclick = (e)=>{
  if(e.target === modal) modal.style.display="none";
}
submitMsg.onclick = ()=>{
  const text = msgInput.value.trim();
  if(!text) return;
  navigator.clipboard.writeText(text).then(()=>{
    alert("✅ 悄悄话复制成功！发给开发者即可");
    modal.style.display="none";
    msgInput.value="";
  })
}
</script>
</body>
</html>
