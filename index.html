<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金阳-MBTI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#111;color:#fff;min-height:100vh;overflow-x:hidden}
.container{max-width:700px;margin:0 auto;padding:24px}
.question{font-size:22px;margin:20px 0}
.option{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid #444;background:#222;color:#fff;border-radius:10px;font-size:18px;cursor:pointer}
.option:hover{background:#333}
.result-box{display:none;padding:20px;border:1px solid #555;border-radius:12px;margin-top:30px}
.action-group{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
.action-btn{padding:12px 18px;border-radius:8px;border:none;font-size:16px;cursor:pointer}
.btn-flower{background:#b84b70;color:#fff}
.btn-msg{background:#2b6cb0;color:#fff}

/* 烟花画布铺满全屏 */
#fireCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:99}
/* 花朵漂浮元素 */
.flower{position:fixed;font-size:36px;pointer-events:none;animation:flyUp 2.2s ease-out forwards;z-index:100}
@keyframes flyUp{
0{opacity:1;transform:translateY(0) scale(1)}
100%{opacity:0;transform:translateY(-320px) scale(1.4)}
}
/* 悄悄话弹窗 */
.modal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.75);z-index:101;align-items:center;justify-content:center;padding:20px}
.modal-content{background:#222;padding:24px;border-radius:12px;width:100%;max-width:480px}
.modal textarea{width:100%;min-height:120px;margin:14px 0;padding:12px;border-radius:8px;background:#333;color:#fff;border:1px solid #555;font-size:16px;resize:vertical}
.modal-buttons{display:flex;gap:10px;justify-content:flex-end}
.modal-btn{padding:10px 16px;border-radius:8px;border:none;cursor:pointer;font-size:15px}
.send{background:#2b6cb0;color:white}
.close{background:#444;color:white}
.tip-text{margin-top:10px;color:#aaa;font-size:14px}
</style>
</head>
<body>
<div class="container">
  <h1>金阳 MBTI 测试</h1>
  <div class="question" id="qText"></div>
  <div id="optWrap"></div>
  <div class="result-box" id="result">
    <h2>你的类型：<span id="typeText"></span></h2>
    <p id="descText" style="margin-top:12px;line-height:1.6"></p>
    <div class="action-group">
      <button class="action-btn btn-flower" id="sendFlowerBtn">🌸 送花花给开发者</button>
      <button class="action-btn btn-msg" id="openMsgBtn">💬 发悄悄话</button>
    </div>
  </div>
</div>

<!-- 悄悄话弹窗 -->
<div class="modal" id="msgModal">
  <div class="modal-content">
    <h3>给开发者留言</h3>
    <textarea id="msgInput" placeholder="写下你的悄悄话..."></textarea>
    <p class="tip-text">⚠ GitHub静态网页无法后台保存消息，留言仅复制文本，你手动发送给开发者</p>
    <div class="modal-buttons">
      <button class="modal-btn close" id="closeModal">取消</button>
      <button class="modal-btn send" id="submitMsg">复制留言</button>
    </div>
  </div>
</div>

<canvas id="fireCanvas"></canvas>

<script>
// -------- MBTI题目（可自行替换原题）
const questions = [
  {q:"聚会后，你通常？",o:["A 精力充沛，想继续玩","B 疲惫，想安静独处"],k:["E","I"]},
  {q:"看待一件事，你更看重？",o:["A 客观事实与细节","B 可能性与整体灵感"],k:["S","N"]},
  {q:"做决定优先？",o:["A 逻辑公平","B 人情感受"],k:["T","F"]},
  {q:"生活习惯偏好？",o:["A 计划安排好","B 随性灵活"],k:["J","P"]},
];
let score={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
let current=0;
const qEl=document.getElementById('qText');
const optWrap=document.getElementById('optWrap');
const resultBox=document.getElementById('result');
const typeText=document.getElementById('typeText');
const descText=document.getElementById('descText');

// 渲染题目
function render(){
  const item=questions[current];
  qEl.innerText=item.q;
  optWrap.innerHTML="";
  item.o.forEach((txt,i)=>{
    const btn=document.createElement('button');
    btn.className="option";
    btn.innerText=txt;
    btn.onclick=()=>{
      score[item.k[i]]++;
      current++;
      if(current >= questions.length){showResult();}
      else render();
    }
    optWrap.appendChild(btn);
  })
}

// 显示结果+启动烟花
function showResult(){
  qEl.style.display="none";optWrap.style.display="none";
  resultBox.style.display="block";
  let type="";
  type += score.E>score.I ? "E":"I";
  type += score.S>score.N ? "S":"N";
  type += score.T>score.F ? "T":"F";
  type += score.J>score.P ? "J":"P";
  typeText.innerText=type;
  descText.innerText="这是你的MBTI类型描述，你可以在这里替换成你写的文案。";
  startFireworks(); // 答完自动放烟花
}
render();

// ========== 烟花特效代码 ==========
const canvas=document.getElementById("fireCanvas");
const ctx=canvas.getContext("2d");
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
resize();
window.addEventListener('resize',resize);
let fireList=[];
class Particle{
  constructor(x,y,color){
    this.x=x;this.y=y;this.sx=(Math.random()-0.5)*8;this.sy=(Math.random()-0.5)*8;
    this.alpha=1;this.color=color;this.size=Math.random()*3+1;
  }
  update(){
    this.x+=this.sx;this.y+=this.sy;this.alpha-=0.018;
  }
  draw(){
    ctx.save();ctx.globalAlpha=this.alpha;
    ctx.fillStyle=this.color;ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}
function startFireworks(){
  const colors=['#ff4466','#ffdd22','#44eeff','#77ff44','#ff77ee'];
  for(let a=0;a<8;a++){
    setTimeout(()=>{
      const x=Math.random()*canvas.width;
      const y=Math.random()*canvas.height*0.4;
      for(let i=0;i<120;i++){
        fireList.push(new Particle(x,y,colors[Math.floor(Math.random()*colors.length)]))
      }
    },a*300)
  }
}
function animate(){
  requestAnimationFrame(animate);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=fireList.length-1;i>=0;i--){
    fireList[i].update();fireList[i].draw();
    if(fireList[i].alpha <=0) fireList.splice(i,1);
  }
}
animate();

// ========== 送花花按钮 ==========
const flowerEmoji = ["🌸","🌷","🌺","💐","🌹","🌻"];
document.getElementById('sendFlowerBtn').onclick = function(e){
  for(let n=0;n<6;n++){
    setTimeout(()=>{
      const f=document.createElement("div");
      f.className="flower";
      f.innerText=flowerEmoji[Math.floor(Math.random()*flowerEmoji.length)];
      f.style.left = e.clientX + (n*30) +"px";
      f.style.top = e.clientY +"px";
      document.body.appendChild(f);
      setTimeout(()=>f.remove(),2200);
    },n*100)
  }
}

// ========== 悄悄话弹窗逻辑 ==========
const modal = document.getElementById('msgModal');
const openMsgBtn = document.getElementById('openMsgBtn');
const closeModal = document.getElementById('closeModal');
const submitMsg = document.getElementById('submitMsg');
const msgInput = document.getElementById('msgInput');

openMsgBtn.onclick = ()=> modal.style.display="flex";
closeModal.onclick = ()=> modal.style.display="none";
// 点击弹窗空白关闭
modal.onclick = (e)=>{
  if(e.target === modal) modal.style.display="none";
}
// 复制留言
submitMsg.onclick = ()=>{
  const text = msgInput.value.trim();
  if(!text) return;
  navigator.clipboard.writeText(text).then(()=>{
    alert("✅ 悄悄话复制成功！发给开发者即可");
    modal.style.display="none";
    msgInput.value="";
  })
}
</script>
</body>
</html>
