body{background:#f7fafe;min-height:100vh;padding:20px 10px;}

<div class="container">

  <!-- 首页欢迎页（专属金阳） -->

  </div>

</div>

let currentQ = 0;

let radarChart = null;
const totalQ = questions.length;

function startTest(){
  document.querySelector(".start").style.display = "none";
  document.querySelector(".question").classList.add("active");
  alert("✨金阳！测试正式开始啦！认真作答，解锁你的专属人格结果～");
  renderQ();
}

function renderQ(){
  let q = questions[currentQ];
  document.getElementById("qNum").innerText = `第 ${currentQ+1} / ${totalQ} 题`;
  document.getElementById("qTitle").innerText = q.q;
  document.getElementById("optBox").innerHTML = "";
  let pct = (currentQ / totalQ) * 100;
  document.getElementById("progressBar").style.width = pct + "%";
  q.o.forEach((txt,idx)=>{
    let btn = document.createElement("button");
    btn.className = "option";
    btn.innerText = txt;
    btn.onclick = ()=>{
      let val = idx;
      if(q.dim === "EI"){ score.E += val; score.I += 4-val; }
      else if(q.dim === "SN"){ score.S += val; score.N += 4-val; }
      else if(q.dim === "TF"){ score.T += val; score.F += 4-val; }
      else if(q.dim === "JP"){ score.J += val; score.P += 4-val; }
      currentQ++;
      if(currentQ >= totalQ){ showResult(); }
      else{
        if(currentQ===12||currentQ===24||currentQ===36){
          alert("💪金阳超棒！已经答完一部分啦，继续加油！");
        }
        renderQ();
      }
    }
    document.getElementById("optBox").appendChild(btn);
  })
}

function showResult(){
  document.querySelector(".question").classList.remove("active");
  document.querySelector(".result").style.display = "block";
  let e_i = score.E - score.I;
  let s_n = score.S - score.N;
  let t_f = score.T - score.F;
  let j_p = score.J - score.P;
  let type = "";
  type += e_i >= 0 ? "E":"I";
  type += s_n >= 0 ? "S":"N";
  type += t_f >= 0 ? "T":"F";
  type += j_p >= 0 ? "J":"P";

  document.getElementById("resName").innerText = data.name;

  document.getElementById("resBad").innerText = data.bad;
